name: Python CI

'on':
  merge_group: {}
  pull_request: {}
  push:
    branches-ignore:
      # These should always correspond to pull requests, so ignore them for
      # the push trigger and let them be triggered by the pull_request
      # trigger, avoiding running the workflow twice.  This is a minor
      # optimization so there's no need to ensure this is comprehensive.
      - 'dependabot/**'
      - 'gh-readonly-queue/**'
      - 'renovate/**'
      - 'tickets/**'
      - 'u/**'
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python:
          - '3.11'
          - '3.12'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Run tox
        uses: lsst-sqre/run-tox@v1
        with:
          python-version: ${{ matrix.python }}
          tox-envs: 'py,typing'

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      HAS_OOK_TOKEN: ${{ secrets.OOK_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools_scm

      - name: Install Graphviz
        run: sudo apt-get install graphviz

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Run tox
        uses: lsst-sqre/run-tox@v1
        with:
          python-version: '3.12'
          tox-envs: 'demo,docs'
        env:
          OOK_TOKEN: ${{ secrets.OOK_TOKEN }}

      - name: Check links
        uses: lsst-sqre/run-tox@v1
        with:
          python-version: '3.12'
          tox-envs: 'docs-linkcheck'
        if: env.HAS_OOK_TOKEN == 'true'
        env:
          OOK_TOKEN: ${{ secrets.OOK_TOKEN }}

      # Upload to Docverse. Fork and dependabot pull requests can't read the
      # DOCVERSE_TOKEN secret, which is why the condition below excludes them.
      - name: Upload to Docverse
        uses: lsst-sqre/docverse-upload@v1
        with:
          org: rubin
          project: 'technote'
          dir: 'docs/_build/html'
          token: ${{ secrets.DOCVERSE_TOKEN }}
          github-token: ${{ github.token }}
          comment-on-pr: 'true'
        if: >
          github.event_name != 'pull_request' || startsWith(github.head_ref, 'tickets/')


  test-packaging:
    name: Test packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools_scm

      - name: Build and publish
        uses: lsst-sqre/build-and-publish-to-pypi@v3
        with:
          upload: false

  pypi:
    # This job requires set up:
    # 1. Set up a trusted publisher for PyPI
    # 2. Set up a "pypi" environment in the repository
    # See https://github.com/lsst-sqre/build-and-publish-to-pypi
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test, docs, test-packaging]
    environment:
      name: pypi
      url: https://pypi.org/p/technote
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools_scm

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Build and publish
        uses: lsst-sqre/build-and-publish-to-pypi@v3
